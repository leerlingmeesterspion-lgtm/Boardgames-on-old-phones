<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Chess Server</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: var(--viewport-height, 100vh);
        overflow: hidden;
        padding: 0.5rem;
      }

      #status,
      #turn-status,
      #last-move {
        flex: 0 0 auto;
        margin: 0;
        text-align: center;
      }

      #identify-name {
        font-size: clamp(4rem, 20vw, 14rem);
        margin: auto 0;
        text-align: center;
      }

      .game-result {
        align-items: center;
        background-color: rgb(0 0 0 / 85%);
        color: #fff;
        display: flex;
        flex-direction: column;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: bold;
        inset: 0;
        justify-content: center;
        line-height: 1.1;
        padding: 1rem;
        position: fixed;
        text-align: center;
        z-index: 10;
      }

      .game-result[hidden] {
        display: none;
      }

      .game-result p {
        margin: 0.2em 0;
      }

      #assigned-squares {
        align-content: center;
        display: grid;
        flex: 1 1 0;
        gap: 0.5rem;
        grid-template-columns: repeat(var(--columns, 1), var(--square-size, 7rem));
        grid-template-rows: repeat(var(--rows, 1), var(--square-size, 7rem));
        justify-content: center;
        min-height: 0;
        width: 100%;
      }

      .assigned-square {
        align-items: center;
        box-sizing: border-box;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        font-family: inherit;
        height: var(--square-size, 7rem);
        justify-content: center;
        min-height: 0;
        min-width: 0;
        padding: 0;
        touch-action: manipulation;
        width: var(--square-size, 7rem);
      }

      .assigned-square.light {
        background-color: #f0d9b5;
        border: 2px solid #222;
        color: #222;
      }

      .assigned-square.dark {
        background-color: #769656;
        border: 2px solid #222;
        color: #fff;
      }

      .assigned-square.selected {
        outline: 4px solid #e6a700;
        outline-offset: 2px;
      }

      .piece {
        font-size: var(--piece-size, 4rem);
        line-height: 1;
      }

      .square-coordinate {
        font-size: var(--coordinate-size, 1rem);
      }

      body.identifying {
        animation: identify-flash 1s ease-in-out infinite alternate;
      }

      @keyframes identify-flash {
        from {
          background-color: #ffeb3b;
        }

        to {
          background-color: #fff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.identifying {
          animation: none;
          background-color: #fff8cc;
        }
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting to the server...</p>
    <p id="turn-status">Waiting for the board...</p>
    <p id="last-move">No moves yet.</p>
    <h1 id="identify-name" hidden></h1>
    <div id="assigned-squares"></div>
    <div id="game-result" class="game-result" role="alert" aria-live="assertive" hidden>
      <p>CHECKMATE</p>
      <p id="game-result-winner"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const storageKey = "modular-chess-device-name";
      const colors = ["BLUE", "RED", "GREEN", "GOLD", "PURPLE", "SILVER", "ORANGE", "WHITE", "BLACK", "TEAL"];
      const animals = ["FOX", "PANDA", "TIGER", "OWL", "LION", "KOALA", "OTTER", "EAGLE", "WOLF", "BEAR"];
      const socket = io();
      const status = document.getElementById("status");
      const turnStatus = document.getElementById("turn-status");
      const lastMoveStatus = document.getElementById("last-move");
      const identifyName = document.getElementById("identify-name");
      const assignedSquares = document.getElementById("assigned-squares");
      const gameResult = document.getElementById("game-result");
      const gameResultWinner = document.getElementById("game-result-winner");
      const pieceSymbols = {
        "black-rook": "♜",
        "black-knight": "♞",
        "black-bishop": "♝",
        "black-queen": "♛",
        "black-king": "♚",
        "black-pawn": "♟",
        "white-rook": "♖",
        "white-knight": "♘",
        "white-bishop": "♗",
        "white-queen": "♕",
        "white-king": "♔",
        "white-pawn": "♙"
      };
      let assignedSquareNames = [];
      let boardState = { board: {}, selectedSquare: null };
      let identifyTimer;
      let moveMessageTimer;

      function chooseRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function getSquareColor(square) {
        if (typeof square !== "string" || !/^[A-H][1-8]$/i.test(square)) {
          throw new Error(`Invalid chess square: ${square}`);
        }

        const colLetter = square.charAt(0).toUpperCase();
        const rank = Number(square.charAt(1));
        const colIndex = colLetter.charCodeAt(0) - "A".charCodeAt(0);
        const sum = colIndex + rank;

        return sum % 2 !== 0 ? "dark" : "light";
      }

      function getAssignedSquareBounds() {
        if (assignedSquareNames.length === 0) {
          return null;
        }

        const fileIndexes = assignedSquareNames.map((square) => square.charCodeAt(0) - "a".charCodeAt(0));
        const ranks = assignedSquareNames.map((square) => Number(square.charAt(1)));
        const minFile = Math.min(...fileIndexes);
        const maxFile = Math.max(...fileIndexes);
        const minRank = Math.min(...ranks);
        const maxRank = Math.max(...ranks);

        return {
          minFile,
          maxRank,
          columns: maxFile - minFile + 1,
          rows: maxRank - minRank + 1
        };
      }

      function fitAssignedSquares() {
        const bounds = getAssignedSquareBounds();
        if (!bounds) {
          return;
        }

        const availableWidth = assignedSquares.clientWidth;
        const availableHeight = assignedSquares.clientHeight;
        const gap = parseFloat(window.getComputedStyle(assignedSquares).gap) || 0;
        const widthPerSquare = (availableWidth - gap * (bounds.columns - 1)) / bounds.columns;
        const heightPerSquare = (availableHeight - gap * (bounds.rows - 1)) / bounds.rows;
        const size = Math.max(0, Math.floor(Math.min(widthPerSquare, heightPerSquare)));

        assignedSquares.style.setProperty("--columns", bounds.columns);
        assignedSquares.style.setProperty("--rows", bounds.rows);
        assignedSquares.style.setProperty("--square-size", `${size}px`);
        assignedSquares.style.setProperty("--piece-size", `${size * 0.6}px`);
        assignedSquares.style.setProperty("--coordinate-size", `${Math.min(20, Math.max(12, size * 0.1))}px`);
      }

      function updateViewportLayout() {
        const viewportHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;
        document.documentElement.style.setProperty("--viewport-height", `${viewportHeight}px`);
        fitAssignedSquares();
      }

      function renderAssignedSquares() {
        assignedSquares.textContent = "";
        const bounds = getAssignedSquareBounds();

        assignedSquareNames.forEach((square) => {
          const pieceName = boardState.board[square];
          const rectangle = document.createElement("button");
          rectangle.type = "button";
          rectangle.className = `assigned-square ${getSquareColor(square)}`;
          rectangle.style.gridColumn = String(square.charCodeAt(0) - "a".charCodeAt(0) - bounds.minFile + 1);
          rectangle.style.gridRow = String(bounds.maxRank - Number(square.charAt(1)) + 1);
          rectangle.setAttribute("aria-label", `${square.toUpperCase()}${pieceName ? `, ${pieceName}` : ""}`);
          if (boardState.selectedSquare === square) {
            rectangle.classList.add("selected");
          }

          const piece = document.createElement("span");
          piece.className = "piece";
          piece.textContent = pieceSymbols[pieceName] || "";
          rectangle.appendChild(piece);

          const coordinate = document.createElement("span");
          coordinate.className = "square-coordinate";
          coordinate.textContent = square.toUpperCase();
          rectangle.appendChild(coordinate);

          rectangle.addEventListener("click", () => {
            socket.emit("square-tapped", square);
          });
          assignedSquares.appendChild(rectangle);
        });

        fitAssignedSquares();
      }

      function renderMoveStatus(state) {
        turnStatus.textContent = `${state.turn} to move.`;
        if (!state.lastMove) {
          lastMoveStatus.textContent = "No moves yet.";
          return;
        }

        const move = state.lastMove;
        const description = `${move.color} moved ${move.from.toUpperCase()} to ${move.to.toUpperCase()}`;
        const capture = move.capturedPiece
          ? `, capturing a ${move.capturedColor.toLowerCase()} ${move.capturedPiece}`
          : "";
        lastMoveStatus.textContent = `${description}${capture}.`;
      }

      function renderGameResult(state) {
        gameResult.hidden = !state.checkmateWinner;
        if (state.checkmateWinner) {
          gameResultWinner.textContent = `${state.checkmateWinner.toUpperCase()} WINS`;
        }
      }

      let deviceName = localStorage.getItem(storageKey);

      if (!deviceName) {
        const number = Math.floor(Math.random() * 90) + 10;
        deviceName = `${chooseRandom(colors)}-${chooseRandom(animals)}-${number}`;
        localStorage.setItem(storageKey, deviceName);
      }

      socket.on("connect", () => {
        socket.emit("register-device", deviceName);
        status.textContent = `Connected as ${deviceName}`;
      });

      socket.on("squares-update", (squares) => {
        assignedSquareNames = squares;
        renderAssignedSquares();
      });

      socket.on("board-update", (state) => {
        boardState = state;
        renderMoveStatus(state);
        renderGameResult(state);
        renderAssignedSquares();
      });

      socket.on("move-rejected", ({ from, to }) => {
        window.clearTimeout(moveMessageTimer);
        status.textContent = `That move is not legal: ${from.toUpperCase()} to ${to.toUpperCase()}`;
        moveMessageTimer = window.setTimeout(() => {
          status.textContent = `Connected as ${deviceName}`;
        }, 3000);
      });

      socket.on("identify", () => {
        window.clearTimeout(identifyTimer);
        document.body.classList.add("identifying");
        status.hidden = true;
        identifyName.textContent = deviceName;
        identifyName.hidden = false;

        identifyTimer = window.setTimeout(() => {
          document.body.classList.remove("identifying");
          status.hidden = false;
          identifyName.hidden = true;
        }, 5000);
      });

      window.addEventListener("resize", updateViewportLayout);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportLayout);
      }
      updateViewportLayout();
    </script>
  </body>
</html>
