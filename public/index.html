<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Chess Server</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: var(--viewport-height, 100vh);
        overflow: hidden;
        padding: 0.5rem;
      }

      #status,
      #turn-status,
      #last-move {
        flex: 0 0 auto;
        margin: 0;
        text-align: center;
      }

      #wake-lock-controls {
        flex: 0 0 auto;
        text-align: center;
      }

      #wake-lock-button {
        min-height: 2.75rem;
        padding: 0.5rem 1rem;
        touch-action: manipulation;
      }

      #wake-lock-status {
        margin: 0.25rem 0 0;
      }

      #identify-name {
        font-size: clamp(4rem, 20vw, 14rem);
        margin: auto 0;
        text-align: center;
      }

      .game-result {
        align-items: center;
        background-color: rgb(0 0 0 / 85%);
        color: #fff;
        display: flex;
        flex-direction: column;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: bold;
        inset: 0;
        justify-content: center;
        line-height: 1.1;
        padding: 1rem;
        position: fixed;
        text-align: center;
        z-index: 10;
      }

      .game-result[hidden] {
        display: none;
      }

      .game-result p {
        margin: 0.2em 0;
      }

      #assigned-squares {
        align-content: center;
        display: grid;
        flex: 1 1 0;
        gap: 0.5rem;
        grid-template-columns: repeat(var(--columns, 1), var(--square-size, 7rem));
        grid-template-rows: repeat(var(--rows, 1), var(--square-size, 7rem));
        justify-content: center;
        min-height: 0;
        width: 100%;
      }

      #assigned-squares.black-side {
        transform: rotate(180deg);
      }

      .assigned-square {
        align-items: center;
        box-sizing: border-box;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        font-family: inherit;
        height: var(--square-size, 7rem);
        justify-content: center;
        min-height: 0;
        min-width: 0;
        padding: 0;
        position: relative;
        touch-action: manipulation;
        width: var(--square-size, 7rem);
      }

      .assigned-square.light {
        background-color: #f0d9b5;
        border: 2px solid #222;
        color: #222;
      }

      .assigned-square.dark {
        background-color: #769656;
        border: 2px solid #222;
        color: #fff;
      }

      .assigned-square.selected {
        outline: 4px solid #e6a700;
        outline-offset: 2px;
      }

      .piece {
        font-size: var(--piece-size, 4rem);
        font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", sans-serif;
        line-height: 1;
      }

      .piece.black {
        color: #000;
        -webkit-text-fill-color: #000;
        transform: rotate(180deg);
      }

      .piece.white {
        color: #fff;
        -webkit-text-fill-color: #fff;
        -webkit-text-stroke: 1px #222;
      }

      .square-coordinate {
        bottom: 0.1rem;
        font-size: var(--coordinate-size, 1rem);
        left: 0.15rem;
        position: absolute;
      }

      .square-coordinate-upside-down {
        bottom: auto;
        left: auto;
        right: 0.15rem;
        top: 0.1rem;
        transform: rotate(180deg);
      }

      body.identifying {
        animation: identify-flash 1s ease-in-out infinite alternate;
      }

      @keyframes identify-flash {
        from {
          background-color: #ffeb3b;
        }

        to {
          background-color: #fff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.identifying {
          animation: none;
          background-color: #fff8cc;
        }
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting to the server...</p>
    <div id="wake-lock-controls">
      <button id="wake-lock-button" type="button">Allow screen to sleep</button>
      <p id="wake-lock-status" role="status" aria-live="polite">Trying to keep the screen awake...</p>
    </div>
    <p id="turn-status">Waiting for the board...</p>
    <p id="last-move">No moves yet.</p>
    <h1 id="identify-name" hidden></h1>
    <div id="assigned-squares"></div>
    <div id="game-result" class="game-result" role="alert" aria-live="assertive" hidden>
      <p id="game-result-heading">CHECKMATE</p>
      <p id="game-result-winner"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const storageKey = "modular-chess-device-name";
      const colors = ["BLUE", "RED", "GREEN", "GOLD", "PURPLE", "SILVER", "ORANGE", "WHITE", "BLACK", "TEAL"];
      const animals = ["FOX", "PANDA", "TIGER", "OWL", "LION", "KOALA", "OTTER", "EAGLE", "WOLF", "BEAR"];
      const socket = io();
      const status = document.getElementById("status");
      const wakeLockButton = document.getElementById("wake-lock-button");
      const wakeLockStatus = document.getElementById("wake-lock-status");
      const turnStatus = document.getElementById("turn-status");
      const lastMoveStatus = document.getElementById("last-move");
      const identifyName = document.getElementById("identify-name");
      const assignedSquares = document.getElementById("assigned-squares");
      const gameResult = document.getElementById("game-result");
      const gameResultHeading = document.getElementById("game-result-heading");
      const gameResultWinner = document.getElementById("game-result-winner");
      const pieceSymbols = {
        "black-rook": "♜",
        "black-knight": "♞",
        "black-bishop": "♝",
        "black-queen": "♛",
        "black-king": "♚",
        "black-pawn": "♟",
        "white-rook": "♖︎",
        "white-knight": "♘︎",
        "white-bishop": "♗︎",
        "white-queen": "♕︎",
        "white-king": "♔︎",
        "white-pawn": "♙︎"
      };
      let assignedSquareNames = [];
      let boardState = { board: {}, selectedSquare: null };
      let identifyTimer;
      let moveMessageTimer;
      let screenWakeLock = null;
      let screenWakeLockEnabled = true;
      let wakeLockRequestPending = false;

      function chooseRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function getSquareColor(square) {
        if (typeof square !== "string" || !/^[A-H][1-8]$/i.test(square)) {
          throw new Error(`Invalid chess square: ${square}`);
        }

        const colLetter = square.charAt(0).toUpperCase();
        const rank = Number(square.charAt(1));
        const colIndex = colLetter.charCodeAt(0) - "A".charCodeAt(0);
        const sum = colIndex + rank;

        return sum % 2 !== 0 ? "dark" : "light";
      }

      function getAssignedSquareBounds() {
        if (assignedSquareNames.length === 0) {
          return null;
        }

        const fileIndexes = assignedSquareNames.map((square) => square.charCodeAt(0) - "a".charCodeAt(0));
        const ranks = assignedSquareNames.map((square) => Number(square.charAt(1)));
        const minFile = Math.min(...fileIndexes);
        const maxFile = Math.max(...fileIndexes);
        const minRank = Math.min(...ranks);
        const maxRank = Math.max(...ranks);

        return {
          minFile,
          maxRank,
          columns: maxFile - minFile + 1,
          rows: maxRank - minRank + 1,
          blackSide: ranks.every((rank) => rank >= 5)
        };
      }

      function fitAssignedSquares() {
        const bounds = getAssignedSquareBounds();
        if (!bounds) {
          return;
        }

        const availableWidth = assignedSquares.clientWidth;
        const availableHeight = assignedSquares.clientHeight;
        const gap = parseFloat(window.getComputedStyle(assignedSquares).gap) || 0;
        const widthPerSquare = (availableWidth - gap * (bounds.columns - 1)) / bounds.columns;
        const heightPerSquare = (availableHeight - gap * (bounds.rows - 1)) / bounds.rows;
        const size = Math.max(0, Math.floor(Math.min(widthPerSquare, heightPerSquare)));

        assignedSquares.style.setProperty("--columns", bounds.columns);
        assignedSquares.style.setProperty("--rows", bounds.rows);
        assignedSquares.style.setProperty("--square-size", `${size}px`);
        assignedSquares.style.setProperty("--piece-size", `${size * 0.6}px`);
        assignedSquares.style.setProperty("--coordinate-size", `${Math.min(20, Math.max(12, size * 0.1))}px`);
      }

      function updateViewportLayout() {
        const viewportHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;
        document.documentElement.style.setProperty("--viewport-height", `${viewportHeight}px`);
        fitAssignedSquares();
      }

      function showWakeLockUnavailable() {
        wakeLockButton.disabled = true;
        wakeLockButton.textContent = "Screen wake lock unavailable";
        wakeLockStatus.textContent = window.isSecureContext
          ? "This browser does not support keeping the screen awake. Increase the device screen timeout in its settings."
          : "Keeping the screen awake requires a secure connection (HTTPS). Increase the device screen timeout in its settings.";
      }

      async function requestScreenWakeLock() {
        if (wakeLockRequestPending || !screenWakeLockEnabled || document.visibilityState !== "visible") {
          return;
        }

        if (!("wakeLock" in navigator)) {
          showWakeLockUnavailable();
          return;
        }

        wakeLockRequestPending = true;
        wakeLockButton.disabled = true;
        try {
          screenWakeLock = await navigator.wakeLock.request("screen");
          wakeLockButton.textContent = "Allow screen to sleep";
          wakeLockStatus.textContent = "The screen will stay awake while this page is visible.";
          screenWakeLock.addEventListener("release", () => {
            screenWakeLock = null;
            if (screenWakeLockEnabled && document.visibilityState === "visible") {
              wakeLockButton.textContent = "Keep screen awake";
              wakeLockStatus.textContent = "The screen wake lock was released. Tap to try again.";
            }
          }, { once: true });
        } catch (error) {
          screenWakeLock = null;
          wakeLockButton.textContent = "Try keeping screen awake";
          wakeLockStatus.textContent = `Could not keep the screen awake: ${error}`;
        } finally {
          wakeLockRequestPending = false;
          wakeLockButton.disabled = false;
        }
      }

      wakeLockButton.addEventListener("click", async () => {
        screenWakeLockEnabled = !screenWakeLockEnabled;
        if (!screenWakeLockEnabled) {
          try {
            if (screenWakeLock && !screenWakeLock.released) {
              await screenWakeLock.release();
            }
            wakeLockButton.textContent = "Keep screen awake";
            wakeLockStatus.textContent = "The screen may sleep while this setting is off.";
          } catch (error) {
            wakeLockStatus.textContent = `Could not release the screen wake lock: ${error}`;
          }
          return;
        }

        await requestScreenWakeLock();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          requestScreenWakeLock();
        }
      });

      function renderAssignedSquareState() {
        Array.from(assignedSquares.children).forEach((rectangle) => {
          const square = rectangle.dataset.square;
          const pieceName = boardState.board[square];
          rectangle.setAttribute("aria-label", `${square.toUpperCase()}${pieceName ? `, ${pieceName}` : ""}`);
          rectangle.classList.toggle("selected", boardState.selectedSquare === square);

          const piece = rectangle.querySelector(".piece");
          piece.className = `piece ${pieceName && pieceName.startsWith("white-") ? "white" : "black"}`;
          piece.textContent = pieceSymbols[pieceName] || "";
        });
      }

      function renderAssignedSquares() {
        assignedSquares.textContent = "";
        const bounds = getAssignedSquareBounds();
        assignedSquares.classList.toggle("black-side", bounds ? bounds.blackSide : false);

        assignedSquareNames.forEach((square) => {
          const rectangle = document.createElement("button");
          rectangle.type = "button";
          rectangle.className = `assigned-square ${getSquareColor(square)}`;
          rectangle.dataset.square = square;
          rectangle.setAttribute("aria-label", `${square.toUpperCase()}${boardState.board[square] ? `, ${boardState.board[square]}` : ""}`);
          const filePosition = square.charCodeAt(0) - "a".charCodeAt(0) - bounds.minFile;
          const rankPosition = bounds.maxRank - Number(square.charAt(1));
          rectangle.style.gridColumn = String(filePosition + 1);
          rectangle.style.gridRow = String(rankPosition + 1);

          const piece = document.createElement("span");
          piece.className = "piece";
          rectangle.appendChild(piece);

          const coordinate = document.createElement("span");
          coordinate.className = "square-coordinate";
          coordinate.textContent = square.toUpperCase();
          rectangle.appendChild(coordinate);

          const upsideDownCoordinate = document.createElement("span");
          upsideDownCoordinate.className = "square-coordinate square-coordinate-upside-down";
          upsideDownCoordinate.textContent = square.toUpperCase();
          rectangle.appendChild(upsideDownCoordinate);

          assignedSquares.appendChild(rectangle);
        });

        fitAssignedSquares();
        renderAssignedSquareState();
      }

      function renderMoveStatus(state) {
        turnStatus.textContent = `${state.turn} to move.`;
        if (!state.lastMove) {
          lastMoveStatus.textContent = "No moves yet.";
          return;
        }

        const move = state.lastMove;
        const description = `${move.color} moved ${move.from.toUpperCase()} to ${move.to.toUpperCase()}`;
        const capture = move.capturedPiece
          ? `, capturing a ${move.capturedColor.toLowerCase()} ${move.capturedPiece}`
          : "";
        lastMoveStatus.textContent = `${description}${capture}.`;
      }

      function renderGameResult(state) {
        gameResult.hidden = !state.checkmateWinner && !state.resignation;
        if (state.resignation) {
          gameResultHeading.textContent = `${state.resignation.resigned.toUpperCase()} RESIGNS`;
          gameResultWinner.textContent = `${state.resignation.winner.toUpperCase()} WINS`;
        } else if (state.checkmateWinner) {
          gameResultHeading.textContent = "CHECKMATE";
          gameResultWinner.textContent = `${state.checkmateWinner.toUpperCase()} WINS`;
        }
      }

      let deviceName = localStorage.getItem(storageKey);

      if (!deviceName) {
        const number = Math.floor(Math.random() * 90) + 10;
        deviceName = `${chooseRandom(colors)}-${chooseRandom(animals)}-${number}`;
        localStorage.setItem(storageKey, deviceName);
      }

      socket.on("connect", () => {
        socket.emit("register-device", deviceName);
        status.textContent = `Connected as ${deviceName}`;
      });

      socket.on("squares-update", (squares) => {
        assignedSquareNames = squares;
        renderAssignedSquares();
      });

      socket.on("board-update", (state) => {
        boardState = state;
        renderMoveStatus(state);
        renderGameResult(state);
        renderAssignedSquareState();
      });

      socket.on("move-rejected", ({ from, to }) => {
        window.clearTimeout(moveMessageTimer);
        status.textContent = `That move is not legal: ${from.toUpperCase()} to ${to.toUpperCase()}`;
        moveMessageTimer = window.setTimeout(() => {
          status.textContent = `Connected as ${deviceName}`;
        }, 3000);
      });

      socket.on("identify", () => {
        window.clearTimeout(identifyTimer);
        document.body.classList.add("identifying");
        status.hidden = true;
        identifyName.textContent = deviceName;
        identifyName.hidden = false;

        identifyTimer = window.setTimeout(() => {
          document.body.classList.remove("identifying");
          status.hidden = false;
          identifyName.hidden = true;
        }, 5000);
      });

      assignedSquares.addEventListener("click", (event) => {
        const rectangle = event.target.closest(".assigned-square");
        if (rectangle) {
          socket.emit("square-tapped", rectangle.dataset.square);
        }
      });

      window.addEventListener("resize", updateViewportLayout);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportLayout);
      }
      updateViewportLayout();
      requestScreenWakeLock();
    </script>
  </body>
</html>
