<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Board Server</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 0;
        height: var(--viewport-height, 100vh);
        overflow: hidden;
        padding: 0;
      }

      .visually-hidden {
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      .device-toolbar {
        bottom: max(0.25rem, env(safe-area-inset-bottom));
        position: fixed;
        right: max(0.25rem, env(safe-area-inset-right));
        z-index: 5;
      }

      #fullscreen-toggle {
        background: rgb(255 255 255 / 85%);
        border: 1px solid #555;
        border-radius: 0.25rem;
        font-size: 0.8rem;
        min-height: 1.6rem;
        opacity: 0.75;
        padding: 0.2rem 0.4rem;
        touch-action: manipulation;
      }

      #fullscreen-message {
        background: #fff;
        border: 1px solid #a00000;
        border-radius: 0.25rem;
        color: #a00000;
        left: 50%;
        font-size: 0.8rem;
        margin: 0;
        padding: 0.25rem;
        position: fixed;
        text-align: center;
        top: max(0.25rem, env(safe-area-inset-top));
        transform: translateX(-50%);
        z-index: 6;
      }

      #fullscreen-message[hidden] {
        display: none;
      }

      #identify-name {
        font-size: clamp(4rem, 20vw, 14rem);
        margin: auto 0;
        text-align: center;
      }

      .game-result {
        align-items: center;
        background-color: rgb(0 0 0 / 85%);
        color: #fff;
        display: flex;
        flex-direction: column;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: bold;
        inset: 0;
        justify-content: center;
        line-height: 1.1;
        padding: 1rem;
        position: fixed;
        text-align: center;
        z-index: 10;
      }

      .game-result[hidden] {
        display: none;
      }

      .game-result p {
        margin: 0.2em 0;
      }

      #assigned-squares {
        align-content: center;
        background-color: #769656;
        display: grid;
        flex: 1 1 0;
        gap: 0;
        grid-template-columns: repeat(var(--columns, 1), var(--square-width, 7rem));
        grid-template-rows: repeat(var(--rows, 1), var(--square-height, 7rem));
        justify-content: center;
        min-height: 0;
        width: 100%;
      }

      #assigned-squares.black-side {
        transform: rotate(180deg);
      }

      .assigned-square {
        align-items: center;
        box-sizing: border-box;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        font-family: inherit;
        height: var(--square-height, 7rem);
        justify-content: center;
        min-height: 0;
        min-width: 0;
        padding: 0;
        position: relative;
        touch-action: manipulation;
        width: var(--square-width, 7rem);
      }

      .assigned-square.light {
        background-color: #f0d9b5;
        border: 1px solid #222;
        color: #222;
      }

      .assigned-square.dark {
        background-color: #769656;
        border: 1px solid #222;
        color: #fff;
      }

      .assigned-square.selected {
        outline: 4px solid #e6a700;
        outline-offset: 2px;
      }

      .assigned-square.legal-target {
        outline: 3px solid #2a7b36;
        outline-offset: -3px;
      }

      .assigned-square.morris-point.legal-target,
      .assigned-square.morris-point.selected {
        outline: none;
      }

      .assigned-square.morris-point.legal-target::before,
      .assigned-square.morris-point.selected::before {
        border: 3px solid #2a7b36;
        border-radius: 50%;
        content: "";
        height: var(--morris-point-size, 4rem);
        left: 50%;
        pointer-events: none;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: var(--morris-point-size, 4rem);
      }

      .assigned-square.morris-point.selected::before {
        border-color: #e6a700;
      }

      .morris-dot {
        aspect-ratio: 1;
        background: #222;
        border-radius: 50%;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 12%;
      }

      .morris-dot[hidden] {
        display: none;
      }

      #assigned-squares.morris-board {
        background-color: #f0d9b5;
        grid-template-columns: repeat(var(--columns, 1), var(--morris-square-size, 7rem));
        grid-template-rows: repeat(var(--rows, 1), var(--morris-square-size, 7rem));
        position: relative;
      }

      #assigned-squares.morris-board .assigned-square {
        height: var(--morris-square-size, 7rem);
        width: var(--morris-square-size, 7rem);
      }

      #assigned-squares.ludo-board {
        background-color: #d7d7d7;
      }

      .assigned-square.ludo-cell[data-ludo-type="empty"] {
        background: #d7d7d7;
      }

      .assigned-square.ludo-cell[data-ludo-type="track"],
      .assigned-square.ludo-cell[data-ludo-type="safe"] {
        background: #fff;
        color: #222;
      }

      .assigned-square.ludo-cell[data-ludo-type="safe"]::after {
        color: #666;
        content: "★";
        font-size: 0.8em;
        position: absolute;
      }

      .assigned-square.ludo-cell[data-ludo-type^="yard-red"],
      .assigned-square.ludo-cell[data-ludo-type^="lane-red"],
      .assigned-square.ludo-cell[data-ludo-type="goal-red"] {
        background: #f3a5a5;
      }

      .assigned-square.ludo-cell[data-ludo-type^="yard-blue"],
      .assigned-square.ludo-cell[data-ludo-type^="lane-blue"],
      .assigned-square.ludo-cell[data-ludo-type="goal-blue"] {
        background: #9dc8f6;
      }

      .assigned-square.ludo-cell[data-ludo-type^="yard-yellow"],
      .assigned-square.ludo-cell[data-ludo-type^="lane-yellow"],
      .assigned-square.ludo-cell[data-ludo-type="goal-yellow"] {
        background: #f6e58d;
      }

      .assigned-square.ludo-cell[data-ludo-type^="yard-green"],
      .assigned-square.ludo-cell[data-ludo-type^="lane-green"],
      .assigned-square.ludo-cell[data-ludo-type="goal-green"] {
        background: #9ed5a0;
      }

      .assigned-square.ludo-cell[data-ludo-type="center"] {
        background: conic-gradient(#4caf50 0 25%, #fbc02d 0 50%, #2196f3 0 75%, #e53935 0);
      }

      .piece.ludo-piece {
        align-items: center;
        border: 1px solid #222;
        border-radius: 50%;
        box-sizing: border-box;
        display: flex;
        font-family: sans-serif;
        font-size: calc(var(--piece-size, 4rem) * 0.55);
        font-weight: bold;
        height: 72%;
        justify-content: center;
        line-height: 1;
        position: relative;
        width: 72%;
        z-index: 1;
      }

      .piece.ludo-piece.red { background: #e53935; color: #fff; }
      .piece.ludo-piece.blue { background: #1976d2; color: #fff; }
      .piece.ludo-piece.yellow { background: #fbc02d; color: #222; }
      .piece.ludo-piece.green { background: #43a047; color: #fff; }
      .piece.ludo-piece.multi { color: #fff; }

      #dice-panel {
        align-items: center;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }

      #dice-panel[hidden] {
        display: none;
      }

      #dice-status {
        font-size: clamp(1.25rem, 5vw, 3rem);
      }

      #dice-value {
        align-items: center;
        background: #fff;
        border: 3px solid #222;
        border-radius: 0.5rem;
        display: flex;
        font-size: clamp(5rem, 25vw, 12rem);
        height: min(45vw, 45vh);
        justify-content: center;
        margin: 0.5rem;
        min-height: 6rem;
        min-width: 6rem;
        width: min(45vw, 45vh);
      }

      #roll-ludo-die {
        font-size: clamp(1.25rem, 5vw, 2rem);
        min-height: 3rem;
        padding: 0.5rem 1.5rem;
        touch-action: manipulation;
      }

      #assigned-squares.morris-board .morris-lines {
        height: calc(var(--rows, 1) * var(--morris-square-size, 7rem));
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(var(--columns, 1) * var(--morris-square-size, 7rem));
      }

      .morris-lines {
        height: 100%;
        inset: 0;
        overflow: visible;
        pointer-events: none;
        position: absolute;
        width: 100%;
        z-index: 0;
      }

      .morris-lines line {
        stroke: #222;
        stroke-width: 0.045;
      }

      .assigned-square.morris-point {
        background: transparent;
        border: 0;
        z-index: 1;
      }

      .piece {
        font-size: var(--piece-size, 4rem);
        font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", sans-serif;
        line-height: 1;
      }

      .piece.black {
        color: #000;
        -webkit-text-fill-color: #000;
        transform: rotate(180deg);
      }

      .piece.white {
        color: #fff;
        -webkit-text-fill-color: #fff;
        -webkit-text-stroke: 1px #222;
      }

      .piece.checker-piece {
        border: 2px solid #222;
        border-radius: 50%;
        box-sizing: border-box;
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 35%), 0 1px 2px #222;
        display: grid;
        flex: 0 0 var(--checker-piece-size, 4rem);
        height: var(--checker-piece-size, 4rem);
        place-items: center;
        width: var(--checker-piece-size, 4rem);
      }

      .piece.checker-piece.black {
        background: #171717;
        color: #fff;
        transform: none;
        -webkit-text-fill-color: #fff;
      }

      .piece.checker-piece.white {
        background: #f8f2e7;
        color: #222;
        -webkit-text-fill-color: #222;
        -webkit-text-stroke: 0;
      }

      .piece.checker-piece.king::after {
        content: "k";
        font-family: sans-serif;
        font-size: 0.45em;
        font-weight: bold;
        line-height: 1;
      }

      .square-coordinate {
        bottom: 0.1rem;
        font-size: var(--coordinate-size, 1rem);
        left: 0.15rem;
        position: absolute;
      }

      .square-coordinate-upside-down {
        bottom: auto;
        left: auto;
        right: 0.15rem;
        top: 0.1rem;
        transform: rotate(180deg);
      }

      body.identifying {
        animation: identify-flash 1s ease-in-out infinite alternate;
      }

      @keyframes identify-flash {
        from {
          background-color: #ffeb3b;
        }

        to {
          background-color: #fff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.identifying {
          animation: none;
          background-color: #fff8cc;
        }
      }

      :fullscreen {
        background: #fff;
      }

      :-webkit-full-screen {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="device-toolbar">
      <p id="status" class="visually-hidden" aria-live="polite">Connecting to the server...</p>
      <button id="fullscreen-toggle" type="button" aria-pressed="false">Full screen</button>
    </div>
    <p id="fullscreen-message" role="status" hidden></p>
    <p id="turn-status" class="visually-hidden" aria-live="polite">Waiting for the board...</p>
    <p id="last-move" class="visually-hidden" aria-live="polite">No moves yet.</p>
    <h1 id="identify-name" hidden></h1>
    <div id="assigned-squares"></div>
    <section id="dice-panel" aria-label="Ludo dice" hidden>
      <p id="dice-status" aria-live="polite">Waiting for the server...</p>
      <output id="dice-value" aria-label="Dice result">—</output>
      <button id="roll-ludo-die" type="button">Roll the die</button>
    </section>
    <div id="game-result" class="game-result" role="alert" aria-live="assertive" hidden>
      <p id="game-result-heading">CHECKMATE</p>
      <p id="game-result-winner"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/morris-layout.js"></script>
    <script>
      const storageKey = "modular-chess-device-name";
      const colors = ["BLUE", "RED", "GREEN", "GOLD", "PURPLE", "SILVER", "ORANGE", "WHITE", "BLACK", "TEAL"];
      const animals = ["FOX", "PANDA", "TIGER", "OWL", "LION", "KOALA", "OTTER", "EAGLE", "WOLF", "BEAR"];
      const socket = io();
      const status = document.getElementById("status");
      const fullscreenToggle = document.getElementById("fullscreen-toggle");
      const fullscreenMessage = document.getElementById("fullscreen-message");
      const deviceToolbar = document.querySelector(".device-toolbar");
      const turnStatus = document.getElementById("turn-status");
      const lastMoveStatus = document.getElementById("last-move");
      const identifyName = document.getElementById("identify-name");
      const assignedSquares = document.getElementById("assigned-squares");
      const dicePanel = document.getElementById("dice-panel");
      const diceStatus = document.getElementById("dice-status");
      const diceValue = document.getElementById("dice-value");
      const rollLudoDieButton = document.getElementById("roll-ludo-die");
      const gameResult = document.getElementById("game-result");
      const gameResultHeading = document.getElementById("game-result-heading");
      const gameResultWinner = document.getElementById("game-result-winner");
      const pieceSymbols = {
        "black-rook": "♜",
        "black-knight": "♞",
        "black-bishop": "♝",
        "black-queen": "♛",
        "black-king": "♚",
        "black-pawn": "♟",
        "white-rook": "♖︎",
        "white-knight": "♘︎",
        "white-bishop": "♗︎",
        "white-queen": "♕︎",
        "white-king": "♔︎",
        "white-pawn": "♙︎"
      };
      let assignedSquareNames = [];
      let boardState = { board: {}, selectedSquare: null };
      let identifyTimer;
      let moveMessageTimer;

      function chooseRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function getSquareColor(square) {
        if (boardState.game === "ludo") {
          return "light";
        }
        if (boardState.game === "morris") {
          return "light";
        }
        if (typeof square !== "string" || !/^[A-J](10|[1-9])$/i.test(square)) {
          throw new Error(`Invalid board coordinate: ${square}`);
        }

        const colLetter = square.charAt(0).toUpperCase();
        const rank = Number(square.slice(1));
        const colIndex = colLetter.charCodeAt(0) - "A".charCodeAt(0);
        const sum = colIndex + rank;

        return sum % 2 !== 0 ? "dark" : "light";
      }

      function getAssignedSquareBounds() {
        const visibleSquares = assignedSquareNames.filter((square) => isSquareOnCurrentBoard(square));
        if (visibleSquares.length === 0) {
          return null;
        }

        const fileIndexes = visibleSquares.map((square) => square.charCodeAt(0) - "a".charCodeAt(0));
        const ranks = visibleSquares.map((square) => Number(square.slice(1)));
        const minFile = Math.min(...fileIndexes);
        const maxFile = Math.max(...fileIndexes);
        const minRank = Math.min(...ranks);
        const maxRank = Math.max(...ranks);
        const boardSize = boardState.boardSize || 8;
        const boardHeight = boardState.boardHeight || boardSize;

        return {
          minFile,
          maxRank,
          columns: maxFile - minFile + 1,
          rows: maxRank - minRank + 1,
          blackSide: ranks.every((rank) => rank > boardHeight / 2)
        };
      }

      function isSquareOnCurrentBoard(square) {
        if (boardState.game === "morris") {
          return MorrisLayout.pointSet.has(square);
        }
        const boardSize = boardState.boardSize || 8;
        const boardWidth = boardState.boardWidth || boardSize;
        const boardHeight = boardState.boardHeight || boardSize;
        const file = square.charCodeAt(0) - "a".charCodeAt(0);
        const rank = Number(square.slice(1));
        return file >= 0 && file < boardWidth && rank >= 1 && rank <= boardHeight;
      }

      function fitAssignedSquares() {
        const bounds = getAssignedSquareBounds();
        if (!bounds) {
          return;
        }

        const availableWidth = assignedSquares.clientWidth;
        const availableHeight = assignedSquares.clientHeight;
        const widthPerSquare = availableWidth / bounds.columns;
        const heightPerSquare = availableHeight / bounds.rows;
        const size = Math.max(0, Math.floor(Math.min(widthPerSquare, heightPerSquare)));

        assignedSquares.style.setProperty("--columns", bounds.columns);
        assignedSquares.style.setProperty("--rows", bounds.rows);
        assignedSquares.style.setProperty("--square-width", `${widthPerSquare}px`);
        assignedSquares.style.setProperty("--square-height", `${heightPerSquare}px`);
        assignedSquares.style.setProperty(
          "--morris-square-size",
          `${Math.max(0, Math.floor(Math.min(widthPerSquare, heightPerSquare)))}px`
        );
        assignedSquares.style.setProperty("--piece-size", `${size * 0.6}px`);
        assignedSquares.style.setProperty("--checker-piece-size", `${size * 0.68}px`);
        assignedSquares.style.setProperty("--morris-point-size", `${size * 0.76}px`);
        assignedSquares.style.setProperty("--coordinate-size", `${Math.min(20, Math.max(12, size * 0.1))}px`);
      }

      function updateViewportLayout() {
        const viewportHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;
        document.documentElement.style.setProperty("--viewport-height", `${viewportHeight}px`);
        fitAssignedSquares();
      }

      function isDocumentFullscreen() {
        return document.fullscreenElement === document.documentElement ||
          document.webkitFullscreenElement === document.documentElement;
      }

      function updateFullscreenButton() {
        const isMorris = boardState.game === "morris";
        const installedApp = window.navigator.standalone === true;
        const fullscreen = isDocumentFullscreen() || installedApp;
        fullscreenToggle.hidden = isMorris;
        fullscreenToggle.textContent = installedApp
          ? "Full screen enabled"
          : fullscreen ? "Exit full screen" : "Full screen";
        fullscreenToggle.disabled = installedApp;
        fullscreenToggle.setAttribute("aria-pressed", String(fullscreen));
        if (isDocumentFullscreen()) {
          fullscreenMessage.hidden = true;
        }
      }

      async function exitFullscreenForMorris() {
        const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exitFullscreen) {
          fullscreenMessage.textContent = "Use your browser's controls to leave full screen.";
          fullscreenMessage.hidden = false;
          return;
        }

        try {
          await exitFullscreen.call(document);
        } catch (error) {
          fullscreenMessage.textContent = "Use your browser's controls to leave full screen.";
          fullscreenMessage.hidden = false;
        }
      }

      async function toggleFullscreen() {
        fullscreenMessage.hidden = true;
        const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
        if (isDocumentFullscreen()) {
          if (!exitFullscreen) {
            fullscreenMessage.textContent = "Use your browser's controls to leave full screen.";
            fullscreenMessage.hidden = false;
            return;
          }
          try {
            await exitFullscreen.call(document);
          } catch (error) {
            fullscreenMessage.textContent = "This browser could not leave full screen. Use its browser controls instead.";
            fullscreenMessage.hidden = false;
          }
          return;
        }

        if (window.navigator.standalone === true) {
          return;
        }

        const requestFullscreen = document.documentElement.requestFullscreen ||
          document.documentElement.webkitRequestFullscreen;
        if (!requestFullscreen) {
          fullscreenMessage.textContent = "Full screen is not supported here. Use your browser's full-screen option.";
          fullscreenMessage.hidden = false;
          return;
        }

        try {
          await requestFullscreen.call(document.documentElement);
        } catch (error) {
          fullscreenMessage.textContent = "Full screen was blocked. Try your browser's full-screen option.";
          fullscreenMessage.hidden = false;
        }
      }

      function renderAssignedSquareState() {
        Array.from(assignedSquares.children).forEach((rectangle) => {
          const square = rectangle.dataset.square;
          if (!square) {
            return;
          }
          const pieceName = boardState.board[square];
          rectangle.setAttribute("aria-label", `${square.toUpperCase()}${pieceName ? `, ${pieceName}` : ""}`);
          rectangle.classList.toggle("selected", boardState.selectedSquare === square);
          rectangle.classList.toggle(
            "legal-target",
            Boolean(boardState.selectableSquares && boardState.selectableSquares.includes(square))
          );

          const piece = rectangle.querySelector(".piece");
          const pointMarker = rectangle.querySelector(".morris-dot");
          if (pointMarker) {
            pointMarker.hidden = Boolean(pieceName);
          }
          const checkerPiece = pieceName &&
            (pieceName.startsWith("White-") || pieceName.startsWith("Black-")) &&
            (pieceName.endsWith("-man") || pieceName.endsWith("-king") || pieceName.endsWith("-stone"));
          const ludoPiece = pieceName && pieceName.includes("-ludo");
          const color = pieceName && (pieceName.startsWith("White-") || pieceName.startsWith("white-"))
            ? "white"
            : "black";
          const ludoColors = ludoPiece
            ? pieceName.slice(0, pieceName.indexOf("-ludo")).split("-")
            : [];
          const ludoColor = ludoColors.length === 1 ? ludoColors[0] : "multi";
          piece.className = `piece ${ludoPiece ? `ludo-piece ${ludoColor}` : color}${checkerPiece ? ` checker-piece${pieceName.endsWith("-stone") ? " morris-stone" : ""}${pieceName.endsWith("-king") ? " king" : ""}` : ""}`;
          piece.style.background = ludoColors.length > 1
            ? `conic-gradient(${ludoColors.map((tokenColor, index) =>
              `${{ red: "#e53935", blue: "#1976d2", yellow: "#fbc02d", green: "#43a047" }[tokenColor]} ${index * 100 / ludoColors.length}% ${(index + 1) * 100 / ludoColors.length}%`
            ).join(", ")})`
            : "";
          piece.textContent = ludoPiece
            ? pieceName.split("-")[2] || "1"
            : checkerPiece ? "" : pieceSymbols[pieceName] || "";
        });
      }

      function renderAssignedSquares() {
        assignedSquares.textContent = "";
        const bounds = getAssignedSquareBounds();
        assignedSquares.classList.toggle("black-side", bounds ? bounds.blackSide : false);
        assignedSquares.classList.toggle("morris-board", boardState.game === "morris");
        assignedSquares.classList.toggle("ludo-board", boardState.game === "ludo");

        if (bounds && boardState.game === "morris") {
          const assigned = new Set(assignedSquareNames.filter((square) => isSquareOnCurrentBoard(square)));
          const lines = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          lines.classList.add("morris-lines");
          lines.setAttribute("viewBox", `0 0 ${bounds.columns} ${bounds.rows}`);
          lines.setAttribute("aria-hidden", "true");
          for (const [first, second] of MorrisLayout.edges) {
            if (!assigned.has(first) || !assigned.has(second)) {
              continue;
            }
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", String(first.charCodeAt(0) - 97 - bounds.minFile + 0.5));
            line.setAttribute("y1", String(bounds.maxRank - Number(first.slice(1)) + 0.5));
            line.setAttribute("x2", String(second.charCodeAt(0) - 97 - bounds.minFile + 0.5));
            line.setAttribute("y2", String(bounds.maxRank - Number(second.slice(1)) + 0.5));
            lines.appendChild(line);
          }
          assignedSquares.appendChild(lines);
        }

        assignedSquareNames.filter((square) => isSquareOnCurrentBoard(square)).forEach((square) => {
          const rectangle = document.createElement("button");
          rectangle.type = "button";
          rectangle.className = `assigned-square ${getSquareColor(square)}${boardState.game === "morris" ? " morris-point" : ""}${boardState.game === "ludo" ? " ludo-cell" : ""}`;
          if (boardState.game === "ludo") {
            rectangle.dataset.ludoType = boardState.ludoLayout[square];
          }
          rectangle.dataset.square = square;
          rectangle.setAttribute("aria-label", `${square.toUpperCase()}${boardState.board[square] ? `, ${boardState.board[square]}` : ""}`);
          if (boardState.game === "morris") {
            const pointMarker = document.createElement("span");
            pointMarker.className = "morris-dot";
            rectangle.appendChild(pointMarker);
          }
          const filePosition = square.charCodeAt(0) - "a".charCodeAt(0) - bounds.minFile;
          const rankPosition = bounds.maxRank - Number(square.slice(1));
          rectangle.style.gridColumn = String(filePosition + 1);
          rectangle.style.gridRow = String(rankPosition + 1);

          const piece = document.createElement("span");
          piece.className = "piece";
          rectangle.appendChild(piece);

          const coordinate = document.createElement("span");
          coordinate.className = "square-coordinate";
          coordinate.textContent = square.toUpperCase();
          rectangle.appendChild(coordinate);

          const upsideDownCoordinate = document.createElement("span");
          upsideDownCoordinate.className = "square-coordinate square-coordinate-upside-down";
          upsideDownCoordinate.textContent = square.toUpperCase();
          rectangle.appendChild(upsideDownCoordinate);

          assignedSquares.appendChild(rectangle);
        });

        fitAssignedSquares();
        renderAssignedSquareState();
      }

      function renderMoveStatus(state) {
        turnStatus.textContent = `${state.gameName} (${state.boardWidth}×${state.boardHeight}): ${state.turn} to move.`;
        if (state.game === "morris") {
          if (state.pendingCapture) {
            turnStatus.textContent = `${state.turn} formed a mill. Tap an opposing piece to remove it.`;
          } else if (state.phase === "placing") {
            turnStatus.textContent = `${state.turn} to place a stone (${state.piecesToPlace[state.turn]} remaining).`;
          } else {
            turnStatus.textContent = `${state.turn} to move. Select a stone, then tap an empty point.`;
          }
        } else if (state.game === "ludo") {
          turnStatus.textContent = state.currentRoll === null
            ? state.lastRoll && state.lastRoll.skipped
              ? `${state.lastRoll.color} rolled ${state.lastRoll.value}; no token can move. ${state.turn} to roll.`
              : `${state.turn} to roll the die on the designated phone.`
            : `${state.turn} rolled ${state.currentRoll}. Select a token, then its destination.`;
        }
        if (!state.lastMove) {
          lastMoveStatus.textContent = "No moves yet.";
          return;
        }

        const move = state.lastMove;
        const description = move.action === "placed"
          ? `${move.color} placed a stone on ${move.to.toUpperCase()}`
          : `${move.color} moved ${move.from.toUpperCase()} to ${move.to.toUpperCase()}`;
        const capture = move.capturedPoint
          ? `, capturing a piece on ${move.capturedPoint.toUpperCase()}`
          : move.capturedPiece
          ? `, capturing a ${move.capturedColor.toLowerCase()} ${move.capturedPiece}`
          : move.capturedCount
            ? `, capturing ${move.capturedCount} token(s)`
          : "";
        const ludoDetails = state.game === "ludo"
          ? ` (rolled ${move.roll}${move.finished ? ", finished a token" : ""})`
          : "";
        lastMoveStatus.textContent = `${description}${capture}${ludoDetails}.`;
      }

      function renderGameResult(state) {
        gameResult.hidden = !state.gameResult;
        gameResultHeading.textContent = state.gameResult ? state.gameResult.heading : "CHECKMATE";
        gameResultWinner.textContent = state.gameResult && state.gameResult.winner
          ? `${state.gameResult.winner.toUpperCase()} WINS`
          : "";
      }

      let deviceName = localStorage.getItem(storageKey);

      if (!deviceName) {
        const number = Math.floor(Math.random() * 90) + 10;
        deviceName = `${chooseRandom(colors)}-${chooseRandom(animals)}-${number}`;
        localStorage.setItem(storageKey, deviceName);
      }

      socket.on("connect", () => {
        socket.emit("register-device", deviceName);
        status.textContent = `Connected as ${deviceName}`;
      });

      socket.on("server-shutting-down", (acknowledge) => {
        status.textContent = "The server is shutting down. Leaving the website.";
        if (typeof acknowledge === "function") {
          acknowledge();
        }
        window.setTimeout(() => {
          window.location.replace("about:blank");
        }, 100);
      });

      socket.on("squares-update", (squares) => {
        assignedSquareNames = squares;
        renderAssignedSquares();
      });

      socket.on("board-update", (state) => {
        const boardSizeChanged =
          (boardState.boardWidth || boardState.boardSize || 8) !== state.boardWidth ||
          (boardState.boardHeight || boardState.boardSize || 8) !== state.boardHeight;
        boardState = state;
        const isDiceDevice = state.game === "ludo" && state.ludoDiceDeviceName === deviceName;
        dicePanel.hidden = !isDiceDevice;
        assignedSquares.hidden = isDiceDevice;
        if (isDiceDevice) {
          diceStatus.textContent = state.currentRoll === null
            ? state.lastRoll && state.lastRoll.skipped
              ? `${state.lastRoll.color} rolled ${state.lastRoll.value}; no token could move. ${state.turn} to roll.`
              : `${state.turn}'s turn. Roll the die.`
            : `${state.turn} rolled ${state.currentRoll}. Move a token on another board.`;
          const shownRoll = state.currentRoll !== null
            ? state.currentRoll
            : state.lastRoll ? state.lastRoll.value : "—";
          diceValue.textContent = String(shownRoll);
          rollLudoDieButton.disabled =
            state.currentRoll !== null || Boolean(state.gameResult);
          rollLudoDieButton.textContent = state.lastRoll && state.lastRoll.skipped &&
            state.lastRoll.value === 6 && state.lastRoll.color === state.turn &&
            state.currentRoll === null
            ? "Roll again"
            : "Roll the die";
        }
        if (state.game === "morris" && isDocumentFullscreen()) {
          exitFullscreenForMorris();
        }
        updateFullscreenButton();
        renderMoveStatus(state);
        renderGameResult(state);
        if (boardSizeChanged) {
          renderAssignedSquares();
        } else {
          renderAssignedSquareState();
        }
      });

      socket.on("move-rejected", ({ from, to }) => {
        window.clearTimeout(moveMessageTimer);
        status.textContent = `That move is not legal: ${from.toUpperCase()} to ${to.toUpperCase()}`;
        moveMessageTimer = window.setTimeout(() => {
          status.textContent = `Connected as ${deviceName}`;
        }, 3000);
      });

      socket.on("identify", () => {
        window.clearTimeout(identifyTimer);
        document.body.classList.add("identifying");
        deviceToolbar.hidden = true;
        status.hidden = true;
        identifyName.textContent = deviceName;
        identifyName.hidden = false;

        identifyTimer = window.setTimeout(() => {
          document.body.classList.remove("identifying");
          deviceToolbar.hidden = false;
          status.hidden = false;
          identifyName.hidden = true;
        }, 5000);
      });

      assignedSquares.addEventListener("click", (event) => {
        const rectangle = event.target.closest(".assigned-square");
        if (rectangle) {
          socket.emit("square-tapped", rectangle.dataset.square);
        }
      });

      fullscreenToggle.addEventListener("click", toggleFullscreen);
      rollLudoDieButton.addEventListener("click", () => {
        socket.emit("roll-ludo-die");
      });
      document.addEventListener("fullscreenchange", () => {
        updateFullscreenButton();
        window.requestAnimationFrame(updateViewportLayout);
      });
      document.addEventListener("webkitfullscreenchange", () => {
        updateFullscreenButton();
        window.requestAnimationFrame(updateViewportLayout);
      });
      window.addEventListener("resize", updateViewportLayout);
      window.addEventListener("orientationchange", updateViewportLayout);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportLayout);
      }
      if (typeof ResizeObserver === "function") {
        new ResizeObserver(fitAssignedSquares).observe(assignedSquares);
      }
      updateFullscreenButton();
      updateViewportLayout();
    </script>
  </body>
</html>
