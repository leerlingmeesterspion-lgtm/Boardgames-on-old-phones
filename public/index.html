<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Chess Server</title>
    <style>
      #identify-name {
        font-size: clamp(4rem, 20vw, 14rem);
        text-align: center;
      }

      #assigned-squares {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .assigned-square {
        align-items: center;
        border: 2px solid #222;
        display: flex;
        font-size: 2rem;
        height: 7rem;
        justify-content: center;
        width: 7rem;
      }

      body.identifying {
        animation: identify-flash 1s ease-in-out infinite alternate;
      }

      @keyframes identify-flash {
        from {
          background-color: #ffeb3b;
        }

        to {
          background-color: #fff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.identifying {
          animation: none;
          background-color: #fff8cc;
        }
      }
    </style>
  </head>
  <body>
    <p id="status">Connecting to the server...</p>
    <h1 id="identify-name" hidden></h1>
    <div id="assigned-squares"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const storageKey = "modular-chess-device-name";
      const colors = ["BLUE", "RED", "GREEN", "GOLD", "PURPLE", "SILVER", "ORANGE", "WHITE", "BLACK", "TEAL"];
      const animals = ["FOX", "PANDA", "TIGER", "OWL", "LION", "KOALA", "OTTER", "EAGLE", "WOLF", "BEAR"];
      const socket = io();
      const status = document.getElementById("status");
      const identifyName = document.getElementById("identify-name");
      const assignedSquares = document.getElementById("assigned-squares");
      let identifyTimer;

      function chooseRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      let deviceName = localStorage.getItem(storageKey);

      if (!deviceName) {
        const number = Math.floor(Math.random() * 90) + 10;
        deviceName = `${chooseRandom(colors)}-${chooseRandom(animals)}-${number}`;
        localStorage.setItem(storageKey, deviceName);
      }

      socket.on("connect", () => {
        socket.emit("register-device", deviceName);
        status.textContent = `Connected as ${deviceName}`;
      });

      socket.on("squares-update", (squares) => {
        assignedSquares.textContent = "";

        squares.forEach((square) => {
          const rectangle = document.createElement("div");
          rectangle.className = "assigned-square";
          rectangle.textContent = square.toUpperCase();
          assignedSquares.appendChild(rectangle);
        });
      });

      socket.on("identify", () => {
        window.clearTimeout(identifyTimer);
        document.body.classList.add("identifying");
        status.hidden = true;
        identifyName.textContent = deviceName;
        identifyName.hidden = false;

        identifyTimer = window.setTimeout(() => {
          document.body.classList.remove("identifying");
          status.hidden = false;
          identifyName.hidden = true;
        }, 5000);
      });
    </script>
  </body>
</html>
