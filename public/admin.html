<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modular Board Admin</title>
    <style>
      .square-picker {
        display: grid;
        grid-template-columns: repeat(var(--board-size, 8), minmax(2.5rem, 1fr));
        gap: 0.25rem;
        max-width: 32rem;
        margin: 0.5rem 0;
      }

      .square-picker label {
        border: 1px solid #888;
        padding: 0.25rem;
        text-align: center;
      }

      .square-picker.morris-picker {
        aspect-ratio: 1;
        grid-template-rows: repeat(7, minmax(0, 1fr));
      }

      .device-assignment-shortcuts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.5rem 0;
      }

      .server-board {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 2px;
        max-width: 32rem;
        width: 100%;
      }

      .server-board.morris-board {
        aspect-ratio: 1;
        gap: 0;
        position: relative;
      }

      .morris-lines {
        height: 100%;
        inset: 0;
        pointer-events: none;
        position: absolute;
        width: 100%;
      }

      .morris-lines line {
        stroke: #222;
        stroke-width: 0.045;
      }

      .server-square.morris-point {
        background: transparent;
        color: #222;
      }

      .server-square.morris-point.selected {
        outline: none;
      }

      .server-square.morris-point.selected::before {
        border: 3px solid #e6a700;
        border-radius: 50%;
        content: "";
        inset: 12%;
        position: absolute;
      }

      .server-square.morris-point .server-square-piece {
        cursor: default;
      }

      .server-square-point {
        aspect-ratio: 1;
        background: #222;
        border-radius: 50%;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 12%;
      }

      .server-square-point[hidden] {
        display: none;
      }

      .server-board.black-side {
        transform: rotate(180deg);
      }

      .server-square {
        align-items: center;
        aspect-ratio: 1;
        display: flex;
        justify-content: center;
        position: relative;
      }

      .server-square.light {
        background-color: #f0d9b5;
        color: #222;
      }

      .server-square.dark {
        background-color: #769656;
        color: #fff;
      }

      .server-square.selected {
        outline: 3px solid #e6a700;
        outline-offset: -3px;
      }

      .server-square-piece {
        color: #000;
        font-size: clamp(1.25rem, 5vw, 2.75rem);
        font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", sans-serif;
        -webkit-text-fill-color: #000;
      }

      .server-square-piece.black {
        filter: brightness(0);
        transform: rotate(180deg);
      }

      .server-square-piece.white {
        color: #fff;
        filter: none;
        -webkit-text-fill-color: #fff;
        -webkit-text-stroke: 1px #222;
      }

      .server-square-piece.checker-piece {
        aspect-ratio: 1;
        border: 2px solid #222;
        border-radius: 50%;
        box-sizing: border-box;
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 35%), 0 1px 2px #222;
        display: grid;
        filter: none;
        flex: 0 0 68%;
        height: auto;
        place-items: center;
        width: 68%;
      }

      .server-square-piece.checker-piece.black {
        background: #171717;
        transform: none;
      }

      .server-square-piece.checker-piece.white {
        background: #f8f2e7;
      }

      .server-square-piece.checker-piece.king::after {
        color: #b8860b;
        content: "k";
        font-family: sans-serif;
        font-size: 0.45em;
        font-weight: bold;
        line-height: 1;
        -webkit-text-fill-color: #b8860b;
      }

      .server-square-coordinate {
        bottom: 0.1rem;
        font-size: 0.6rem;
        left: 0.15rem;
        position: absolute;
      }

      .server-square-coordinate-upside-down {
        bottom: auto;
        left: auto;
        right: 0.15rem;
        top: 0.1rem;
        transform: rotate(180deg);
      }

      .game-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .game-result {
        align-items: center;
        background-color: rgb(0 0 0 / 85%);
        color: #fff;
        display: flex;
        flex-direction: column;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: bold;
        inset: 0;
        justify-content: center;
        line-height: 1.1;
        padding: 1rem;
        position: fixed;
        text-align: center;
        z-index: 10;
      }

      .game-result[hidden] {
        display: none;
      }

      .game-result p {
        margin: 0.2em 0;
      }
    </style>
  </head>
  <body>
    <h1>Connected board devices</h1>
    <p id="status">Connecting to the server...</p>
    <p id="turn-status">Waiting for the board...</p>
    <p id="last-move">No moves yet.</p>
    <label for="game-select">Game (switching starts a new game):</label>
    <select id="game-select">
      <option value="chess">Chess (8×8)</option>
      <option value="checkers">International draughts (10×10)</option>
      <option value="morris">Nine Men's Morris</option>
    </select>
    <div class="game-controls">
      <button id="undo-move" type="button" disabled>Revert last move</button>
      <button id="black-resigns" type="button" disabled>Black resigns</button>
      <button id="white-resigns" type="button" disabled>White resigns</button>
    </div>
    <h2>Server thinks physical board</h2>
    <button id="flip-board" type="button" aria-pressed="false">Flip board for Black</button>
    <div id="server-board" class="server-board" role="grid" aria-label="Server chessboard"></div>
    <div id="game-result" class="game-result" role="alert" aria-live="assertive" hidden>
      <p id="game-result-heading">CHECKMATE</p>
      <p id="game-result-winner"></p>
    </div>
    <ul id="devices">
      <li>Waiting for device list...</li>
    </ul>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/morris-layout.js"></script>
    <script>
      const socket = io();
      const status = document.getElementById("status");
      const turnStatus = document.getElementById("turn-status");
      const lastMoveStatus = document.getElementById("last-move");
      const undoMoveButton = document.getElementById("undo-move");
      const deviceList = document.getElementById("devices");
      const serverBoard = document.getElementById("server-board");
      const gameResult = document.getElementById("game-result");
      const gameResultHeading = document.getElementById("game-result-heading");
      const gameResultWinner = document.getElementById("game-result-winner");
      const flipBoardButton = document.getElementById("flip-board");
      const gameSelect = document.getElementById("game-select");
      const blackResignsButton = document.getElementById("black-resigns");
      const whiteResignsButton = document.getElementById("white-resigns");
      const boardSquares = new Map();
      let renderedBoardSize = 0;
      let renderedGame = "";
      let currentBoardSize = 8;
      let connectedDevices = [];
      const pieceSymbols = {
        "black-rook": "♜",
        "black-knight": "♞",
        "black-bishop": "♝",
        "black-queen": "♛",
        "black-king": "♚",
        "black-pawn": "♟",
        "white-rook": "♖︎",
        "white-knight": "♘︎",
        "white-bishop": "♗︎",
        "white-queen": "♕︎",
        "white-king": "♔︎",
        "white-pawn": "♙︎"
      };

      function isSquareInsideBoard(square, size) {
        const file = square.charCodeAt(0) - "a".charCodeAt(0);
        const rank = Number(square.slice(1));
        return file >= 0 && file < size && rank >= 1 && rank <= size;
      }

      function renderBoard(board, selectedSquare, size) {
        const isMorris = gameSelect.value === "morris";
        if (renderedBoardSize !== size || renderedGame !== gameSelect.value) {
          serverBoard.textContent = "";
          boardSquares.clear();
          renderedBoardSize = size;
          renderedGame = gameSelect.value;
          serverBoard.classList.toggle("morris-board", isMorris);
          serverBoard.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
          serverBoard.style.gridTemplateRows = `repeat(${size}, minmax(0, 1fr))`;
          serverBoard.setAttribute("aria-label", `${size} by ${size} ${gameSelect.selectedOptions[0].text} board`);
          const files = "abcdefghij";

          if (isMorris) {
            const lines = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            lines.classList.add("morris-lines");
            lines.setAttribute("viewBox", `0 0 ${size} ${size}`);
            lines.setAttribute("aria-hidden", "true");
            for (const [first, second] of MorrisLayout.edges) {
              const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
              line.setAttribute("x1", String(first.charCodeAt(0) - 96 - 0.5));
              line.setAttribute("y1", String(size - Number(first.slice(1)) + 0.5));
              line.setAttribute("x2", String(second.charCodeAt(0) - 96 - 0.5));
              line.setAttribute("y2", String(size - Number(second.slice(1)) + 0.5));
              lines.appendChild(line);
            }
            serverBoard.appendChild(lines);
          }

          for (let rank = size; rank >= 1; rank--) {
            for (let fileIndex = 0; fileIndex < size; fileIndex++) {
              const file = files[fileIndex];
              const square = `${file}${rank}`;
              if (isMorris && !MorrisLayout.pointSet.has(square)) {
                continue;
              }
              const cell = document.createElement("div");
              const color = (fileIndex + rank) % 2 === 1 ? "dark" : "light";
              cell.className = `server-square ${color}${isMorris ? " morris-point" : ""}`;
              cell.setAttribute("role", "gridcell");
              if (isMorris) {
                cell.style.gridColumn = String(fileIndex + 1);
                cell.style.gridRow = String(size - rank + 1);
              }

              const piece = document.createElement("span");
              piece.className = "server-square-piece";
              cell.appendChild(piece);

              if (isMorris) {
                const pointMarker = document.createElement("span");
                pointMarker.className = "server-square-point";
                cell.appendChild(pointMarker);
              }

              const coordinate = document.createElement("span");
              coordinate.className = "server-square-coordinate";
              coordinate.textContent = square;
              cell.appendChild(coordinate);

              const upsideDownCoordinate = document.createElement("span");
              upsideDownCoordinate.className = "server-square-coordinate server-square-coordinate-upside-down";
              upsideDownCoordinate.textContent = square;
              cell.appendChild(upsideDownCoordinate);

              boardSquares.set(square, { cell, piece });
              serverBoard.appendChild(cell);
            }
          }
        }

        for (const [square, elements] of boardSquares) {
          const pieceName = board[square];
          elements.cell.setAttribute("aria-label", `${square}${pieceName ? `, ${pieceName}` : ""}`);
          elements.cell.classList.toggle("selected", square === selectedSquare);
          const checkerPiece = pieceName &&
            (pieceName.startsWith("White-") || pieceName.startsWith("Black-")) &&
            (pieceName.endsWith("-man") || pieceName.endsWith("-king") || pieceName.endsWith("-stone"));
          const color = pieceName &&
            (pieceName.startsWith("white-") || pieceName.startsWith("White-"))
            ? "white"
            : "black";
          elements.piece.className = `server-square-piece ${color}${checkerPiece ? ` checker-piece${pieceName.endsWith("-stone") ? " morris-stone" : ""}${pieceName.endsWith("-king") ? " king" : ""}` : ""}`;
          elements.piece.textContent = checkerPiece ? "" : pieceSymbols[pieceName] || "";
          const pointMarker = elements.cell.querySelector(".server-square-point");
          if (pointMarker) {
            pointMarker.hidden = Boolean(pieceName);
          }
        }
      }

      function renderMoveStatus(state) {
        turnStatus.textContent = `${state.gameName} (${state.boardSize}×${state.boardSize}): ${state.turn} to move.`;
        if (state.game === "morris") {
          if (state.pendingCapture) {
            turnStatus.textContent = `${state.turn} formed a mill. Remove an opposing piece.`;
          } else if (state.phase === "placing") {
            turnStatus.textContent = `${state.turn} to place a stone (${state.piecesToPlace[state.turn]} remaining).`;
          } else {
            turnStatus.textContent = `${state.turn} to move. Select a stone, then an empty point.`;
          }
        }
        if (!state.lastMove) {
          lastMoveStatus.textContent = "No moves yet.";
          return;
        }

        const move = state.lastMove;
        const description = move.action === "placed"
          ? `${move.color} placed a stone on ${move.to.toUpperCase()}`
          : `${move.color} moved ${move.from.toUpperCase()} to ${move.to.toUpperCase()}`;
        const capture = move.capturedPoint
          ? `, capturing a piece on ${move.capturedPoint.toUpperCase()}`
          : move.capturedPiece
          ? `, capturing a ${move.capturedColor.toLowerCase()} ${move.capturedPiece}`
          : "";
        lastMoveStatus.textContent = `${description}${capture}.`;
      }

      function renderGameResult(state) {
        gameResult.hidden = !state.gameResult;
        gameResultHeading.textContent = state.gameResult ? state.gameResult.heading : "CHECKMATE";
        gameResultWinner.textContent = state.gameResult && state.gameResult.winner
          ? `${state.gameResult.winner.toUpperCase()} WINS`
          : "";
      }

      function renderDevices(devices) {
        connectedDevices = devices;
        deviceList.textContent = "";

        if (devices.length === 0) {
          const item = document.createElement("li");
          item.textContent = "No devices connected.";
          deviceList.appendChild(item);
          return;
        }

        devices.forEach((device) => {
          const item = document.createElement("li");

          const heading = document.createElement("h2");
          heading.textContent = device.name;
          item.appendChild(heading);

          const identifyButton = document.createElement("button");
          identifyButton.textContent = "Identify";
          identifyButton.addEventListener("click", () => {
            socket.emit("identify-device", device.id);
          });
          item.appendChild(identifyButton);

          const assignedLabel = document.createElement("p");
          assignedLabel.textContent = `Assigned squares for ${currentBoardSize}×${currentBoardSize} board:`;
          item.appendChild(assignedLabel);

          const assignmentShortcuts = document.createElement("div");
          assignmentShortcuts.className = "device-assignment-shortcuts";
          const halves = gameSelect.value === "morris" ? ["left", "right"] : ["bottom", "top"];
          for (const half of halves) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = `Assign ${half} half`;
            button.addEventListener("click", () => {
              const midpoint = currentBoardSize / 2;
              squarePicker.querySelectorAll("input[type=checkbox]").forEach((checkbox) => {
                if (gameSelect.value === "morris") {
                  const fileIndex = checkbox.value.charCodeAt(0) - "a".charCodeAt(0);
                  checkbox.checked = half === "left" ? fileIndex < midpoint : fileIndex >= midpoint;
                } else {
                  const rank = Number(checkbox.value.slice(1));
                  checkbox.checked = half === "bottom" ? rank <= midpoint : rank > midpoint;
                }
              });
            });
            assignmentShortcuts.appendChild(button);
          }
          item.appendChild(assignmentShortcuts);

          const squarePicker = document.createElement("div");
          squarePicker.className = `square-picker${gameSelect.value === "morris" ? " morris-picker" : ""}`;
          squarePicker.style.setProperty("--board-size", currentBoardSize);
          const files = "abcdefghij";

          for (let rank = currentBoardSize; rank >= 1; rank--) {
            for (let fileIndex = 0; fileIndex < currentBoardSize; fileIndex++) {
              const square = `${files[fileIndex]}${rank}`;
              if (gameSelect.value === "morris" && !MorrisLayout.pointSet.has(square)) {
                continue;
              }
              const label = document.createElement("label");
              if (gameSelect.value === "morris") {
                label.style.gridColumn = String(fileIndex + 1);
                label.style.gridRow = String(currentBoardSize - rank + 1);
              }
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.value = square;
              checkbox.checked = device.squares.includes(square);
              label.appendChild(checkbox);
              label.appendChild(document.createTextNode(square.toUpperCase()));
              squarePicker.appendChild(label);
            }
          }
          item.appendChild(squarePicker);

          const saveButton = document.createElement("button");
          saveButton.textContent = "Save";
          saveButton.addEventListener("click", () => {
            const squares = Array.from(squarePicker.querySelectorAll("input:checked"))
              .map((checkbox) => checkbox.value);
            socket.emit("save-device-squares", {
              deviceId: device.id,
              squares: gameSelect.value === "morris"
                ? squares
                : [
                  ...squares,
                  ...device.squares.filter((square) => !isSquareInsideBoard(square, currentBoardSize))
                ]
            });
          });
          item.appendChild(saveButton);

          deviceList.appendChild(item);
        });
      }

      undoMoveButton.addEventListener("click", () => {
        socket.emit("undo-move");
      });

      blackResignsButton.addEventListener("click", () => {
        socket.emit("resign", "Black");
      });

      whiteResignsButton.addEventListener("click", () => {
        socket.emit("resign", "White");
      });

      gameSelect.addEventListener("change", () => {
        socket.emit("change-game", gameSelect.value);
      });

      flipBoardButton.addEventListener("click", () => {
        const flipped = serverBoard.classList.toggle("black-side");
        flipBoardButton.setAttribute("aria-pressed", String(flipped));
        flipBoardButton.textContent = flipped ? "Show board for White" : "Flip board for Black";
      });

      socket.on("connect", () => {
        status.textContent = "Connected to the server.";
      });

      socket.on("disconnect", () => {
        status.textContent = "Disconnected from the server.";
      });

      socket.on("board-update", (state) => {
        const boardSizeChanged = currentBoardSize !== state.boardSize;
        currentBoardSize = state.boardSize;
        gameSelect.value = state.game;
        renderBoard(state.board, state.selectedSquare, state.boardSize);
        renderMoveStatus(state);
        renderGameResult(state);
        undoMoveButton.disabled = !state.canUndo || Boolean(state.resignation);
        blackResignsButton.disabled = Boolean(state.gameResult);
        whiteResignsButton.disabled = Boolean(state.gameResult);
        if (boardSizeChanged) {
          renderDevices(connectedDevices);
        }
      });

      socket.on("devices-update", (devices) => {
        renderDevices(devices);
      });
    </script>
  </body>
</html>
